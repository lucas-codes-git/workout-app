services:
  api:
    build:
      context: .
      target: api
    container_name: workout_api
    restart: unless-stopped

    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    container_name: workout_frontend
    restart: unless-stopped

    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:5173:80"

    environment:
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME must be set in .env}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set in .env}

    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: workout_postgres
    restart: unless-stopped

    environment:
      ENV: DEV
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workout_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: